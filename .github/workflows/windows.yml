name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guards:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Test CI and Store guards without network or credentials
        shell: powershell
        run: |
          .\tests\tools\Test-CiBuild.ps1
          .\tests\tools\Test-StoreRelease.ps1
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        project: [RedrainCast.Tests, RedrainCast.Receive.Tests, RedrainCast.Send.Tests]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test .\tests\${{ matrix.project }}\${{ matrix.project }}.csproj -c Release --logger trx -- xUnit.ParallelizeTestCollections=false
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: failure()
        with:
          name: test-results-${{ matrix.project }}
          path: tests/**/TestResults/*.trx
          retention-days: 1
  prepare-release:
    needs: [guards, test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == 'arisewanggithub/RedrainCast-Windows'
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Prepare private CI draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\tools\Publish-CiBuild.ps1 -Stage Prepare
  package:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, x64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Prepare pinned media libraries
        shell: pwsh
        run: .\tools\PrepareNative.ps1 -Architecture ${{ matrix.architecture }} -CacheDirectory "$env:LOCALAPPDATA\RedrainCast-build-cache"
      - name: Publish
        shell: pwsh
        run: .\tools\Publish.ps1 -Architecture ${{ matrix.architecture }}
      - name: Package unsigned MSIX
        shell: pwsh
        run: .\tools\Package.ps1 -Architecture ${{ matrix.architecture }} -PublishedDirectory .\artifacts\win-${{ matrix.architecture }} -OutputDirectory .\artifacts\msix-${{ matrix.architecture }}
  release-package:
    needs: prepare-release
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, x64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Prepare pinned media libraries
        shell: pwsh
        run: .\tools\PrepareNative.ps1 -Architecture ${{ matrix.architecture }} -CacheDirectory "$env:LOCALAPPDATA\RedrainCast-build-cache"
      - name: Publish
        shell: pwsh
        run: .\tools\Publish.ps1 -Architecture ${{ matrix.architecture }}
      - name: Package unsigned MSIX
        shell: pwsh
        run: .\tools\Package.ps1 -Architecture ${{ matrix.architecture }} -PublishedDirectory .\artifacts\win-${{ matrix.architecture }} -OutputDirectory .\artifacts\msix-${{ matrix.architecture }}
      - name: Upload private CI package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\tools\Publish-CiBuild.ps1 -Stage Upload -Architecture ${{ matrix.architecture }}
  complete-release:
    needs: release-package
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify both architectures and publish private CI prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\tools\Publish-CiBuild.ps1 -Stage Complete
