name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guards:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, arise-local]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}\dotnet
        with:
          dotnet-version: 10.0.x
      - name: Test CI and Store guards without network or credentials
        shell: powershell
        run: |
          .\tests\tools\Test-CiBuild.ps1
          .\tests\tools\Test-StoreRelease.ps1
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, arise-local]
    strategy:
      fail-fast: false
      matrix:
        project: [RedrainCast.Tests, RedrainCast.Receive.Tests, RedrainCast.Send.Tests]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}\dotnet
        with:
          dotnet-version: 10.0.x
      - run: dotnet test .\tests\${{ matrix.project }}\${{ matrix.project }}.csproj -c Release --logger trx -- xUnit.ParallelizeTestCollections=false
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: failure()
        with:
          name: test-results-${{ matrix.project }}
          path: tests/**/TestResults/*.trx
          retention-days: 1
  prepare-release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == 'arisewanggithub/RedrainCast-Windows'
    runs-on: [self-hosted, Windows, X64, arise-local]
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Prepare official versioned release draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\tools\Publish-CiBuild.ps1 -Stage Prepare
  package:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, arise-local]
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, x64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}\dotnet
        with:
          dotnet-version: 10.0.x
      - name: Prepare pinned media libraries
        shell: pwsh
        run: .\tools\PrepareNative.ps1 -Architecture ${{ matrix.architecture }} -CacheDirectory "$env:LOCALAPPDATA\RedrainCast-build-cache"
      - name: Publish
        shell: pwsh
        run: .\tools\Publish.ps1 -Architecture ${{ matrix.architecture }} -Version 0.2.1
      - name: Package unsigned MSIX
        shell: pwsh
        run: .\tools\Package.ps1 -Architecture ${{ matrix.architecture }} -PublishedDirectory .\artifacts\win-${{ matrix.architecture }} -OutputDirectory .\artifacts\msix-${{ matrix.architecture }}
      - name: Smoke-test extracted x64 package payload
        if: matrix.architecture == 'x64'
        shell: powershell
        run: .\tools\Test-PackageLaunch.ps1 -StagingDirectory .\artifacts\msix-x64\staging -ReportPath .\artifacts\msix-x64\launch-validation.json -InstallFrameworkDependency
  release-package:
    needs: prepare-release
    runs-on: [self-hosted, Windows, X64, arise-local]
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, x64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}\dotnet
        with:
          dotnet-version: 10.0.x
      - name: Prepare pinned media libraries
        shell: pwsh
        run: .\tools\PrepareNative.ps1 -Architecture ${{ matrix.architecture }} -CacheDirectory "$env:LOCALAPPDATA\RedrainCast-build-cache"
      - name: Publish
        shell: pwsh
        run: |
          . .\tools\CiBuild.ps1
          $version = Get-CiBuildVersion $env:GITHUB_RUN_NUMBER ([int]$env:GITHUB_RUN_ATTEMPT)
          .\tools\Publish.ps1 -Architecture ${{ matrix.architecture }} -Version $version
      - name: Package MSIX with optional publisher signing
        shell: pwsh
        env:
          MSIX_SIGNING_PFX_BASE64: ${{ secrets.MSIX_SIGNING_PFX_BASE64 }}
          MSIX_SIGNING_PASSWORD: ${{ secrets.MSIX_SIGNING_PASSWORD }}
        run: |
          . .\tools\CiBuild.ps1
          $version = Get-CiBuildVersion $env:GITHUB_RUN_NUMBER ([int]$env:GITHUB_RUN_ATTEMPT)
          .\tools\Package.ps1 -Architecture ${{ matrix.architecture }} -Version "$version.0" -PublishedDirectory .\artifacts\win-${{ matrix.architecture }} -OutputDirectory .\artifacts\msix-${{ matrix.architecture }}
      - name: Smoke-test extracted x64 package payload
        if: matrix.architecture == 'x64'
        shell: powershell
        run: .\tools\Test-PackageLaunch.ps1 -StagingDirectory .\artifacts\msix-x64\staging -ReportPath .\artifacts\msix-x64\launch-validation.json -InstallFrameworkDependency
      - name: Upload release MSIX
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\tools\Publish-CiBuild.ps1 -Stage Upload -Architecture ${{ matrix.architecture }}
  complete-release:
    needs: [guards, test, release-package]
    runs-on: [self-hosted, Windows, X64, arise-local]
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify both architectures and publish official release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\tools\Publish-CiBuild.ps1 -Stage Complete
