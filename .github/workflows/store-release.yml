name: Microsoft Store release
run-name: Microsoft Store — ${{ inputs.stage || 'release-latest' }} (${{ github.ref_name }})
on:
  workflow_run:
    workflows: [Windows build]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      stage:
        description: Official CLI operation (discard deletes only an explicitly inspected unchanged draft)
        required: true
        default: preflight
        type: choice
        options: [preflight, inspect-draft, discard-draft, upload-draft, submit-draft, release-latest, status]
      inspect_submission_id:
        description: Exact pending submission ID (inspection or explicitly authorized discard only)
        type: string
      inspect_run_id:
        description: Successful main inspection run with unchanged snapshot (discard-draft only)
        type: string
      build_run_id:
        description: Successful main Windows build run ID (required for upload; derived from receipt for submit)
        type: string
      draft_run_id:
        description: Successful upload-draft run ID whose receipt must be used (submit only)
        type: string
      confirm_store:
        description: Type 9P1153MP6R32 to authorize this Store operation
        required: true
        type: string
      approved_base_price_id:
        description: OPTIONAL explicit base-price CHANGE authorization (Free/NotAvailable/Tier number); never infer Free from Base
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: microsoft-store-9P1153MP6R32
  cancel-in-progress: false
jobs:
  offline-checks:
    if: >-
      github.ref == 'refs/heads/main' && github.repository == 'arisewanggithub/RedrainCast-Windows' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test Store guards without network or credentials
        shell: powershell
        run: .\tests\tools\Test-StoreRelease.ps1
  store:
    needs: offline-checks
    if: github.ref == 'refs/heads/main' && github.repository == 'arisewanggithub/RedrainCast-Windows'
    runs-on: windows-latest
    environment: microsoft-store
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned official Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        if: inputs.stage == 'upload-draft' || inputs.stage == 'release-latest' || github.event_name == 'workflow_run'
        with:
          dotnet-version: 10.0.x
      - name: Perform explicitly selected Store operation
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_STAGE: ${{ inputs.stage || 'release-latest' }}
          STORE_INSPECT_SUBMISSION_ID: ${{ inputs.inspect_submission_id }}
          STORE_INSPECT_RUN_ID: ${{ inputs.inspect_run_id }}
          STORE_BUILD_RUN_ID: ${{ inputs.build_run_id }}
          STORE_DRAFT_RUN_ID: ${{ inputs.draft_run_id }}
          STORE_CONFIRMATION: ${{ github.event_name == 'workflow_run' && '9P1153MP6R32' || inputs.confirm_store }}
          STORE_APPROVED_BASE_PRICE_ID: ${{ inputs.approved_base_price_id }}
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
        run: |
          .\tools\Invoke-StoreRelease.ps1 -Stage $env:STORE_STAGE `
            -InspectSubmissionId $env:STORE_INSPECT_SUBMISSION_ID `
            -InspectRunId $env:STORE_INSPECT_RUN_ID `
            -BuildRunId $env:STORE_BUILD_RUN_ID -DraftRunId $env:STORE_DRAFT_RUN_ID `
            -ConfirmStore $env:STORE_CONFIRMATION -ApprovedBasePriceId $env:STORE_APPROVED_BASE_PRICE_ID
      - name: Keep sanitized receipt in private Actions only
        if: always() && (inputs.stage == 'upload-draft' || inputs.stage == 'release-latest' || github.event_name == 'workflow_run')
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: store-draft-receipt
          path: artifacts/store-release/store-draft-receipt.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep read-only fingerprint snapshot
        if: success() && inputs.stage == 'inspect-draft'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: store-inspection
          path: artifacts/store-release/store-inspection.json
          if-no-files-found: error
          retention-days: 14
      - name: Keep verified certification acceptance
        if: success() && (inputs.stage == 'release-latest' || github.event_name == 'workflow_run')
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: store-certification-receipt
          path: artifacts/store-release/store-certification-receipt.json
          if-no-files-found: error
          retention-days: 14
